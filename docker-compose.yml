services:
  word-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: word-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./texts:/app/texts
    environment:
      - WORD_ENV=development
      - WORD_PORT=8080
      - WORD_DB_PATH=/app/data/word.db
      - WORD_LOG_LEVEL=debug
      - WORD_LOG_FORMAT=json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
